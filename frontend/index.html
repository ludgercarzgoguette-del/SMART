<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOCOMOTIVE PRO X</title>

<style>
body{
background:#071320;
font-family:Arial,sans-serif;
color:white;
margin:0;
padding:20px;
}

h1{
margin:0;
}

.container{
max-width:1300px;
margin:auto;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:20px;
}

.card{
background:#102235;
border-radius:15px;
padding:20px;
box-shadow:0 0 15px rgba(0,0,0,.25);
}

button{
background:#00c853;
color:white;
border:none;
padding:14px;
width:100%;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

.watch{
display:flex;
justify-content:space-between;
padding:8px 0;
border-bottom:1px solid #20384d;
}

.good{
color:#00e676;
}

.bad{
color:#ff5252;
}
</style>

</head>

<body>

<div class="container">

<h1>🚂 LOCOMOTIVE PRO X</h1>

<p>Opening Bell AI Assistant</p>

<div class="grid">

<div class="card">

<h2>📊 Market Balance</h2>

<div class="watch"><span>SPY</span><span class="good">Bullish</span></div>
<div class="watch"><span>QQQ</span><span class="good">Bullish</span></div>
<div class="watch"><span>VIX</span><span class="bad">Bearish</span></div>
<div class="watch"><span>NQ</span><span class="good">Bullish</span></div>

</div>

<div class="card">

<h2>🚀 Morning Scan</h2>

<button onclick="scan()">RUN AI SCAN</button>

<p id="scanResult">Waiting...</p>

</div>

<div class="card">

<h2>⭐ Watchlist</h2>

<div class="watch"><span>TSLA</span><span>WAIT</span></div>
<div class="watch"><span>META</span><span>WAIT</span></div>
<div class="watch"><span>NVDA</span><span>WAIT</span></div>
<div class="watch"><span>AMD</span><span>WAIT</span></div>

</div>

<div class="card">

<h2>📰 Economic Calendar</h2>

<p>CPI</p>
<p>FOMC</p>
<p>NFP</p>
<p>Powell</p>

</div>

</div>

</div>

<script>

function scan(){

document.getElementById("scanResult").innerHTML=`

<b>Today's Trade</b><br><br>

TSLA<br>

🟢 CALL<br><br>

Confidence: 91%<br>

Entry: --<br>

Stop: --<br>

TP1: --<br>

TP2: --

`;

}

</script>

</body>

</html>
